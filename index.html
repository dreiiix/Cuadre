    --bg:#F2F2F7; --card:#FFFFFF; --label:#1C1C1E; --secondary:#8E8E93;
    --separator:#E5E5EA; --chip:#E9E9EB; --blue:#0A84FF; --green:#30D158;
    --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0; --indigo:#6C71E8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%;}
  body{padding-bottom:40px; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type="number"]{-moz-appearance:textfield;}
  input,button{font-family:inherit;}
  button{-webkit-appearance:none; appearance:none;}
  .num{font-variant-numeric:tabular-nums;}
  .press:active{opacity:.55;}
  .wrap{max-width:480px; margin:0 auto; padding:0 20px;}
  .scroller{display:flex; gap:8px; overflow-x:auto; padding:0 20px 16px; max-width:480px; margin:0 auto;
    -ms-overflow-style:none; scrollbar-width:none;}
  .scroller::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; padding:8px 16px; border-radius:20px; border:none; background:var(--chip);
    color:var(--label); font-size:14px; font-weight:600; text-transform:capitalize; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--label); color:#fff;}
  .chip-round{flex-shrink:0; width:36px; height:36px; border-radius:18px; border:none; background:var(--chip);
    color:var(--label); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .card{background:var(--card); border-radius:18px;}
  .sep{border-bottom:0.5px solid var(--separator);}
  svg-icon{display:inline-flex;}
  a{color:inherit;}
</style>
</head>
<body>

<div id="loading" style="display:flex; align-items:center; justify-content:center; padding:60px 20px; font-size:15px; color:var(--secondary);">Cargando…</div>
<div id="app" style="display:none;"></div>

<script>
// ---------------- icon helpers (feather-style inline SVG) ----------------
const ICONS = {
  plus: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  trash: (s=14,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  chevron: (s=17,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  check: (s=13,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  wallet: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>`,
  trendUp: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  home: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  card: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
  sparkles: (s=16,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L19 9.8l-5.1 1.9L12 16.6l-1.9-4.9L5 9.8l5.1-1.9L12 3Z"/><path d="M19 3v4M21 5h-4"/></svg>`,
  fileX: (s=14,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="9.5" y1="12.5" x2="14.5" y2="17.5"/><line x1="14.5" y1="12.5" x2="9.5" y2="17.5"/></svg>`,
  pencil: (s=13,c='currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
};

const CATS = {
  income:  {label:"Ingresos",           singular:"ingreso",             color:"var(--green)",  icon:ICONS.trendUp, hasStatus:false},
  fixed:   {label:"Gastos fijos",       singular:"gasto fijo",          color:"var(--orange)", icon:ICONS.home,    hasStatus:true},
  cards:   {label:"Tarjetas y créditos",singular:"tarjeta o crédito",   color:"var(--indigo)", icon:ICONS.card,    hasStatus:true},
  variable:{label:"Gastos variables",   singular:"gasto variable",      color:"var(--teal)",   icon:ICONS.sparkles,hasStatus:false},
};
const CAT_KEYS = ["income","fixed","cards","variable"];
const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function displayLabel(mk){ return (labels[mk] && labels[mk].trim()) ? labels[mk].trim() : monthLabel(mk); }
function displayChip(mk){ return (labels[mk] && labels[mk].trim()) ? labels[mk].trim() : `${monthShort(mk)} ${mk.split("-")[0]}`; }
function monthKeyNow(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function monthLabel(key){ const [y,m]=key.split("-").map(Number); const n=MONTH_NAMES[m-1]; return `${n.charAt(0).toUpperCase()}${n.slice(1)} ${y}`; }
function monthShort(key){ const [,m]=key.split("-").map(Number); return MONTH_NAMES[m-1].slice(0,3); }
function shiftMonthKey(key,delta){ const [y,m]=key.split("-").map(Number); const d=new Date(y,m-1+delta,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function fmtCLP(n){ return Math.round(Number(n)||0).toLocaleString("es-CL"); }
function emptyMonthData(){ return {income:[],fixed:[],cards:[],variable:[]}; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const MONTHS_KEY = "cuadre:months";
const LABELS_KEY = "cuadre:labels";
const dataKey = mk => `cuadre:data:${mk}`;

function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}
function storageDelete(key){ try{ localStorage.removeItem(key); }catch(e){} }

// ---------------- state ----------------
let months = [];
let labels = {};
let activeMonth = null;
let editingTitle = false;
let newMonthLabelDraft = null;
let data = emptyMonthData();
let openSections = {income:true, fixed:true, cards:false, variable:false};
let showNewMonth = false;
let copyPrev = true;
let confirmDeleteMonth = false;
let saveError = false;
let importMessage = null;

function init(){
  labels = storageGet(LABELS_KEY, {});
  let list = storageGet(MONTHS_KEY, []);
  if(!Array.isArray(list) || list.length===0){
    const mk = monthKeyNow();
    list = [mk];
    storageSet(MONTHS_KEY, list);
    storageSet(dataKey(mk), emptyMonthData());
  }
  list.sort();
  months = list;
  activeMonth = list.includes(monthKeyNow()) ? monthKeyNow() : list[list.length-1];
  data = {...emptyMonthData(), ...storageGet(dataKey(activeMonth), emptyMonthData())};
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
}

function loadMonth(mk){
  activeMonth = mk;
  data = {...emptyMonthData(), ...storageGet(dataKey(mk), emptyMonthData())};
  render();
}

function persist(){
  saveError = !storageSet(dataKey(activeMonth), data);
}

function totals(){
  const sum = arr => arr.reduce((s,it)=>s+(Number(it.amount)||0),0);
  const sumPaid = arr => arr.filter(it=>it.paid).reduce((s,it)=>s+(Number(it.amount)||0),0);
  const income = sum(data.income), fixed=sum(data.fixed), cards=sum(data.cards), variable=sum(data.variable);
  const egresos = fixed+cards+variable;
  const paidOut = sumPaid(data.fixed) + sumPaid(data.cards) + variable;
  const pendingOut = egresos - paidOut;
  return {income,fixed,cards,variable,egresos, balance: income-egresos, paidOut, pendingOut, realBalance: income-paidOut};
}

function addItem(catKey, name, amount){
  if(!name.trim()) return;
  const item = {id:uid(), name:name.trim(), amount:Number(amount)||0};
  if(CATS[catKey].hasStatus) item.paid = false;
  data[catKey].push(item);
  persist(); render();
}
function removeItem(catKey, id){
  data[catKey] = data[catKey].filter(it=>it.id!==id);
  persist(); render();
}
function editItem(catKey, id, patch){
  data[catKey] = data[catKey].map(it => it.id===id ? {...it, ...patch} : it);
  persist(); render();
}

function nextNewMonthKey(){
  const last = [...months].sort().pop() || monthKeyNow();
  let c = shiftMonthKey(last, 1);
  while(months.includes(c)) c = shiftMonthKey(c, 1);
  return c;
}

function createMonth(mk, doCopy, customLabel){
  let seed = emptyMonthData();
  if(doCopy && months.length){
    const prevKey = [...months].sort().filter(m=>m<mk).pop() || months[months.length-1];
    const prevData = storageGet(dataKey(prevKey), emptyMonthData());
    seed = {
      income: (prevData.income||[]).map(it=>({...it,id:uid()})),
      fixed: (prevData.fixed||[]).map(it=>({...it,id:uid(),paid:false})),
      cards: (prevData.cards||[]).map(it=>({...it,id:uid(),paid:false})),
      variable: [],
    };
  }
  months = Array.from(new Set([...months, mk])).sort();
  storageSet(MONTHS_KEY, months);
  storageSet(dataKey(mk), seed);
  const trimmed = (customLabel||"").trim();
  const defaultLabel = monthLabel(mk);
  if(trimmed && trimmed !== defaultLabel){ labels[mk] = trimmed; } else { delete labels[mk]; }
  storageSet(LABELS_KEY, labels);
  showNewMonth = false;
  newMonthLabelDraft = null;
  loadMonth(mk);
}

function renameActiveMonth(newLabel){
  const trimmed = (newLabel||"").trim();
  const defaultLabel = monthLabel(activeMonth);
  if(trimmed && trimmed !== defaultLabel){ labels[activeMonth] = trimmed; } else { delete labels[activeMonth]; }
  storageSet(LABELS_KEY, labels);
  editingTitle = false;
  render();
}

function deleteMonthNow(){
  if(months.length<=1){ confirmDeleteMonth=false; render(); return; }
  storageDelete(dataKey(activeMonth));
  months = months.filter(m=>m!==activeMonth);
  storageSet(MONTHS_KEY, months);
  confirmDeleteMonth = false;
  loadMonth(months[months.length-1]);
}

// ---------------- render ----------------
function render(){
  const t = totals();
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="wrap" style="padding-top:22px; padding-bottom:14px;">
      <h1 style="font-size:34px; font-weight:800; letter-spacing:-0.03em; margin:0;">Cuadre</h1>
      ${editingTitle ? `
        <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
          <input id="titleInput" value="${esc(displayLabel(activeMonth))}" style="flex:1; min-width:0; font-size:15px; font-weight:600; color:var(--label); padding:6px 10px; border-radius:8px; border:1.5px solid var(--blue); background:var(--card);" />
          <button data-action="save-title" class="press" style="border:none; background:var(--blue); color:#fff; border-radius:8px; padding:7px 10px; font-size:13px; font-weight:700; cursor:pointer;">Listo</button>
        </div>
      ` : `
        <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
          <p style="margin:0; font-size:15px; color:var(--secondary); font-weight:500;">${esc(displayLabel(activeMonth))}</p>
          <button data-action="edit-title" class="press" aria-label="Cambiar nombre del mes" style="border:none; background:none; color:var(--secondary); cursor:pointer; padding:4px; display:flex; align-items:center;">${ICONS.pencil ? ICONS.pencil(13) : ''}</button>
        </div>
      `}
    </div>

    <div class="scroller">
      ${months.map(mk => `<button class="chip ${mk===activeMonth?'active':''} press" data-action="month" data-month="${mk}" style="text-transform:none;">${esc(displayChip(mk))}</button>`).join("")}
      <button class="chip-round press" data-action="new-month" aria-label="Agregar mes">${ICONS.plus(16)}</button>
    </div>

    ${showNewMonth ? `
    <div class="wrap" style="padding-bottom:16px;">
      <div class="card" style="padding:16px;">
        <div style="font-weight:700; font-size:16px; margin-bottom:10px;">Nuevo mes</div>
        <label style="display:block; font-size:12.5px; color:var(--secondary); font-weight:600; margin-bottom:6px;">Nombre</label>
        <input id="newMonthNameInput" value="${esc(newMonthLabelDraft !== null ? newMonthLabelDraft : monthLabel(nextNewMonthKey()))}" style="width:100%; padding:9px 10px; border-radius:9px; border:1.5px solid var(--separator); background:var(--bg); font-size:14.5px; color:var(--label); margin-bottom:14px;" />
        <label style="display:flex; align-items:center; gap:10px; font-size:14px; color:var(--secondary); margin-bottom:16px; cursor:pointer;">
          <span data-action="toggle-copy" class="press" style="width:22px; height:22px; border-radius:6px; flex-shrink:0; cursor:pointer; background:${copyPrev?'var(--blue)':'var(--chip)'}; display:flex; align-items:center; justify-content:center;">
            ${copyPrev ? ICONS.check(14,"#fff") : ""}
          </span>
          Copiar gastos fijos y tarjetas del mes anterior
        </label>
        <div style="display:flex; gap:10px;">
          <button data-action="create-month" class="press" style="flex:1; padding:12px 0; border-radius:14px; border:none; background:var(--blue); color:#fff; font-weight:700; font-size:15px; cursor:pointer;">Crear mes</button>
          <button data-action="cancel-new-month" class="press" style="padding:12px 18px; border-radius:14px; border:none; background:var(--chip); color:var(--label); font-size:15px; font-weight:600; cursor:pointer;">Cancelar</button>
        </div>
      </div>
    </div>` : ""}

    <div class="wrap" style="padding-bottom:16px;">
      ${walletCardHtml(t)}
    </div>

    <div class="wrap" style="padding-bottom:16px;">
      ${realBalanceCardHtml(t)}
    </div>

    <div class="wrap" style="padding-bottom:16px;">
      ${visualSummaryHtml(t)}
    </div>

    <div class="wrap" style="display:flex; flex-direction:column; gap:12px;">
      ${CAT_KEYS.map(sectionHtml).join("")}
    </div>

    <div class="wrap" style="padding-top:16px;">
      <div class="card" style="padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div>
          <div style="font-weight:700; font-size:14px;">Respaldo</div>
          <div style="font-size:12px; color:var(--secondary); margin-top:1px;">Exporta o restaura todos tus meses</div>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button data-action="export-data" class="press" style="border:none; background:var(--chip); color:var(--label); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;">Exportar</button>
          <button data-action="import-data" class="press" style="border:none; background:var(--chip); color:var(--label); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;">Importar</button>
        </div>
      </div>
      <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" />
      ${importMessage ? `<div style="margin-top:8px; font-size:12.5px; color:${importMessage.ok?'var(--green)':'var(--red)'};">${esc(importMessage.text)}</div>` : ""}
    </div>

    <div class="wrap" style="padding-top:20px;">
      ${!confirmDeleteMonth ? `
        <button data-action="ask-delete-month" style="font-size:13px; color:${months.length<=1?'var(--chip)':'var(--secondary)'}; background:none; border:none; cursor:${months.length<=1?'default':'pointer'}; padding:6px 0; font-weight:500;" ${months.length<=1?'disabled':''}>Eliminar mes ${esc(displayLabel(activeMonth))}</button>
      ` : `
        <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:var(--red); flex-wrap:wrap;">
          <span>¿Eliminar ${esc(displayLabel(activeMonth))} y todos sus datos?</span>
          <button data-action="confirm-delete-month" class="press" style="border:none; background:var(--red); color:#fff; border-radius:10px; padding:6px 12px; cursor:pointer; font-weight:700;">Sí, eliminar</button>
          <button data-action="cancel-delete-month" class="press" style="border:none; background:var(--chip); color:var(--label); border-radius:10px; padding:6px 12px; cursor:pointer; font-weight:600;">Cancelar</button>
        </div>
      `}
      ${saveError ? `<div style="margin-top:10px; font-size:12.5px; color:var(--red);">No se pudo guardar el último cambio en este dispositivo.</div>` : ""}
    </div>
  `;
  attachAddForms();
}

function walletCardHtml(t){
  const negative = t.balance < 0;
  const gradient = negative
    ? "linear-gradient(135deg, #3B0F10 0%, #7A1F1C 55%, #B23A32 100%)"
    : "linear-gradient(135deg, #0B2A1E 0%, #146B45 55%, #2FBE7F 100%)";
  return `
  <div style="position:relative; overflow:hidden; border-radius:22px; padding:22px 22px 20px; background:${gradient}; color:#fff; box-shadow:0 12px 24px -12px rgba(0,0,0,0.35);">
    <div style="position:absolute; top:-60px; right:-60px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,0.08);"></div>
    <div style="position:absolute; bottom:-70px; left:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.06);"></div>
    <div style="position:relative; display:flex; align-items:center; gap:8px; margin-bottom:14px;">
      ${ICONS.wallet(16,"rgba(255,255,255,0.85)")}
      <span style="font-size:12.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.85);">Saldo disponible</span>
    </div>
    <div class="num" style="position:relative; font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1;">${negative?'-':''}$${fmtCLP(Math.abs(t.balance))}</div>
    ${negative ? `<div style="position:relative; font-size:13px; margin-top:6px; color:rgba(255,255,255,0.85); font-weight:500;">Te faltan $${fmtCLP(Math.abs(t.balance))} para cubrir el mes</div>` : ""}
    <div style="position:relative; display:flex; gap:24px; margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.18);">
      <div>
        <div style="font-size:11px; color:rgba(255,255,255,0.7); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">Ingreso</div>
        <div class="num" style="font-size:17px; font-weight:700; margin-top:2px;">$${fmtCLP(t.income)}</div>
      </div>
      <div>
        <div style="font-size:11px; color:rgba(255,255,255,0.7); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;">Gastos</div>
        <div class="num" style="font-size:17px; font-weight:700; margin-top:2px;">$${fmtCLP(t.egresos)}</div>
      </div>
    </div>
  </div>`;
}

function realBalanceCardHtml(t){
  const negative = t.realBalance < 0;
  const pct = t.income>0 ? Math.min(100, Math.round((t.paidOut/t.income)*100)) : 0;
  return `
  <div class="card" style="padding:16px 18px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
      <div style="font-weight:700; font-size:14.5px;">Saldo real</div>
      <div style="font-size:11.5px; color:var(--secondary); font-weight:600;">${pct}% del ingreso ya salió</div>
    </div>
    <div style="font-size:12px; color:var(--secondary); margin-bottom:12px;">Tu ingreso menos lo que ya has pagado o gastado</div>

    <div style="height:6px; border-radius:3px; background:var(--bg); overflow:hidden; margin-bottom:12px;">
      <div style="height:100%; width:${pct}%; background:${negative?'var(--red)':'var(--green)'}; border-radius:3px; transition:width .3s ease;"></div>
    </div>

    <div style="display:flex; gap:18px;">
      <div style="flex:1;">
        <div style="font-size:11px; color:var(--secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;">Ingreso</div>
        <div class="num" style="font-size:15px; font-weight:700; margin-top:2px;">$${fmtCLP(t.income)}</div>
      </div>
      <div style="flex:1;">
        <div style="font-size:11px; color:var(--secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;">Ya pagado</div>
        <div class="num" style="font-size:15px; font-weight:700; margin-top:2px; color:var(--orange);">-$${fmtCLP(t.paidOut)}</div>
      </div>
      <div style="flex:1;">
        <div style="font-size:11px; color:var(--secondary); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;">Te queda</div>
        <div class="num" style="font-size:15px; font-weight:800; margin-top:2px; color:${negative?'var(--red)':'var(--green)'};">${negative?'-':''}$${fmtCLP(Math.abs(t.realBalance))}</div>
      </div>
    </div>
  </div>`;
}

function visualSummaryHtml(t){
  const base = Math.max(t.income, t.egresos, 1);
  const pct = v => Math.min(100, (v/base)*100);
  const over = t.balance < 0 ? Math.abs(t.balance) : 0;
  const committedPct = t.income>0 ? Math.min(999, Math.round((t.egresos/t.income)*100)) : 0;

  const segs = [
    {key:"fixed", value:t.fixed, color:"var(--orange)"},
    {key:"cards", value:t.cards, color:"var(--indigo)"},
    {key:"variable", value:t.variable, color:"var(--teal)"},
  ].filter(s=>s.value>0);

  const bar = segs.map(s=>`<div style="width:${pct(s.value)}%; background:${s.color}; height:100%;" title="${CATS[s.key].label}"></div>`).join("");
  const remainder = t.balance>0 ? `<div style="width:${pct(t.balance)}%; background:var(--separator); height:100%;"></div>` : "";
  const overlay = over>0 ? `<div style="position:absolute; right:0; top:0; bottom:0; width:${Math.min(100,(over/base)*100)}%; background:repeating-linear-gradient(135deg, var(--red), var(--red) 3px, transparent 3px, transparent 6px);"></div>` : "";

  const legend = segs.map(s=>{
    const cfg = CATS[s.key];
    return `<span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--secondary);">
      <span style="width:7px; height:7px; border-radius:2px; background:${s.color}; display:inline-block;"></span>${cfg.label}
    </span>`;
  }).join("");

  return `
  <div class="card" style="padding:14px 16px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <span style="font-size:13px; color:var(--secondary); font-weight:600;">Comprometido del ingreso</span>
      <span class="num" style="font-size:13.5px; font-weight:800;">${committedPct}%</span>
    </div>
    <div style="position:relative; height:10px; border-radius:5px; overflow:hidden; display:flex; background:var(--bg);">
      ${bar}${remainder}${overlay}
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:9px;">${legend}</div>
  </div>`;
}

function sectionHtml(catKey){
  const cfg = CATS[catKey];
  const items = data[catKey];
  const total = items.reduce((s,it)=>s+(Number(it.amount)||0),0);
  const open = openSections[catKey];
  const rows = items.length===0
    ? `<div style="display:flex; align-items:center; gap:8px; padding:2px 16px 14px; font-size:13px; color:var(--secondary);">${ICONS.fileX(14)}Aún no agregas ningún ${cfg.singular}.</div>`
    : items.map((it,i)=>rowHtml(catKey, it, cfg, i===items.length-1)).join("");

  return `
  <div class="card" style="overflow:hidden;">
    <button data-action="toggle-section" data-cat="${catKey}" class="press" style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:none; border:none; cursor:pointer; text-align:left;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:30px; height:30px; border-radius:8px; background:${cfg.color}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${cfg.icon(16,"#fff")}</div>
        <div>
          <div style="font-weight:600; font-size:15px;">${cfg.label}</div>
          <div class="num" style="font-size:13px; color:var(--secondary); margin-top:1px;">${items.length} ${items.length===1?"ítem":"ítems"} · $${fmtCLP(total)}</div>
        </div>
      </div>
      <span style="transform:${open?'rotate(180deg)':'none'}; transition:transform .2s; color:var(--secondary);">${ICONS.chevron(17)}</span>
    </button>
    ${open ? `
    <div>
      ${rows}
      <form data-cat="${catKey}" class="add-form" style="display:flex; align-items:center; gap:8px; padding:10px 16px 14px; ${items.length?'border-top:0.5px solid var(--separator);':''}">
        <div style="width:22px; height:22px; border-radius:11px; background:var(--chip); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${ICONS.plus(13,cfg.colorHex||'')}</div>
        <input name="name" placeholder="Agregar ${cfg.singular}" style="flex:1; min-width:0; padding:6px 0; border:none; background:transparent; font-size:14.5px; color:var(--label);" />
        <input name="amount" type="number" inputmode="numeric" enterkeyhint="done" placeholder="$" style="width:80px; padding:6px 8px; border-radius:8px; border:none; background:var(--bg); font-size:14px; color:var(--label); text-align:right;" />
        <button type="submit" class="press" aria-label="Agregar ${cfg.singular}" style="width:30px; height:30px; border-radius:15px; border:none; background:${cfg.color}; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">${ICONS.plus(15)}</button>
      </form>
    </div>` : ""}
  </div>`;
}

function rowHtml(catKey, item, cfg, isLast){
  const checkbox = cfg.hasStatus
    ? `<button data-action="toggle-paid" data-cat="${catKey}" data-id="${item.id}" class="press" aria-label="Marcar" style="width:24px; height:24px; border-radius:50%; flex-shrink:0; cursor:pointer; border:2px solid ${item.paid?cfg.color:'var(--chip)'}; background:${item.paid?cfg.color:'transparent'}; display:flex; align-items:center; justify-content:center;">${item.paid?ICONS.check(13,'#fff'):''}</button>`
    : `<span style="width:6px; height:6px; border-radius:3px; background:${cfg.color}; flex-shrink:0; margin-left:9px; margin-right:3px;"></span>`;
  return `
  <div class="${isLast?'':'sep'}" style="display:flex; align-items:center; gap:10px; padding:10px 16px;">
    ${checkbox}
    <span style="flex:1; min-width:0; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:${cfg.hasStatus&&item.paid?'var(--secondary)':'var(--label)'}; text-decoration:${cfg.hasStatus&&item.paid?'line-through':'none'};">${esc(item.name)}</span>
    <button data-action="edit-amount" data-cat="${catKey}" data-id="${item.id}" class="num" style="font-size:14px; font-weight:600; color:var(--label); background:none; border:none; cursor:pointer; padding:3px 4px; white-space:nowrap;">$${fmtCLP(item.amount)}</button>
    <button data-action="remove" data-cat="${catKey}" data-id="${item.id}" class="press" aria-label="Eliminar" style="background:none; border:none; color:var(--secondary); cursor:pointer; padding:3px; flex-shrink:0;">${ICONS.trash(14)}</button>
  </div>`;
}

function attachAddForms(){
  document.querySelectorAll("form.add-form").forEach(form=>{
    form.addEventListener("submit", e=>{
      e.preventDefault();
      const cat = form.dataset.cat;
      const name = form.elements["name"].value;
      const amount = form.elements["amount"].value;
      if(!name.trim()) return;
      addItem(cat, name, amount);
    });
    form.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("focus", ()=>{
        setTimeout(()=>{ form.scrollIntoView({block:"center", behavior:"smooth"}); }, 300);
      });
    });
  });
}

// ---------------- inline amount edit ----------------
function startEditAmount(catKey, id, btn){
  const items = data[catKey];
  const item = items.find(it=>it.id===id);
  if(!item) return;
  const input = document.createElement("input");
  input.type = "number"; input.inputMode = "numeric";
  input.value = item.amount;
  input.style.cssText = "width:86px; padding:4px 8px; border-radius:8px; border:1.5px solid var(--blue); font-size:14px; text-align:right; background:var(--bg);";
  btn.replaceWith(input);
  input.focus(); input.select();
  const commit = () => { editItem(catKey, id, {amount: Number(input.value)||0}); };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter") input.blur();
    if(e.key==="Escape") render();
  });
}

// ---------------- event delegation ----------------
function exportAllData(){
  const backup = { version: 1, exportedAt: new Date().toISOString(), months, labels, data: {} };
  months.forEach(mk => { backup.data[mk] = storageGet(dataKey(mk), emptyMonthData()); });
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cuadre-respaldo-${today}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importAllData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || !Array.isArray(obj.months) || typeof obj.data !== "object"){
        importMessage = {ok:false, text:"El archivo no tiene el formato esperado."};
        render();
        return;
      }
      const proceed = window.confirm("Esto reemplaza los meses del respaldo sobre tus datos actuales en este dispositivo. ¿Continuar?");
      if(!proceed) return;
      const mergedMonths = Array.from(new Set([...months, ...obj.months])).sort();
      storageSet(MONTHS_KEY, mergedMonths);
      Object.keys(obj.data).forEach(mk => { storageSet(dataKey(mk), obj.data[mk]); });
      if(obj.labels && typeof obj.labels === "object"){
        labels = {...labels, ...obj.labels};
        storageSet(LABELS_KEY, labels);
      }
      months = mergedMonths;
      importMessage = {ok:true, text:`Se importaron ${obj.months.length} mes(es) correctamente.`};
      loadMonth(activeMonth && months.includes(activeMonth) ? activeMonth : months[months.length-1]);
    }catch(e){
      importMessage = {ok:false, text:"No se pudo leer el archivo. ¿Es un respaldo de Cuadre?"};
      render();
    }
  };
  reader.onerror = () => { importMessage = {ok:false, text:"No se pudo leer el archivo."}; render(); };
  reader.readAsText(file);
}

document.getElementById("app").addEventListener("click", e=>{
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  if(action==="month"){ loadMonth(btn.dataset.month); }
  else if(action==="new-month"){ showNewMonth = !showNewMonth; newMonthLabelDraft = null; render(); }
  else if(action==="edit-title"){ editingTitle = true; render(); const inp=document.getElementById("titleInput"); if(inp){ inp.focus(); inp.select(); } }
  else if(action==="save-title"){ const inp=document.getElementById("titleInput"); renameActiveMonth(inp ? inp.value : ""); }
  else if(action==="cancel-new-month"){ showNewMonth = false; render(); }
  else if(action==="toggle-copy"){ copyPrev = !copyPrev; render(); }
  else if(action==="create-month"){ const inp=document.getElementById("newMonthNameInput"); createMonth(nextNewMonthKey(), copyPrev, inp ? inp.value : null); }
  else if(action==="toggle-section"){ const c=btn.dataset.cat; openSections[c]=!openSections[c]; render(); }
  else if(action==="toggle-paid"){ const c=btn.dataset.cat, id=btn.dataset.id; const it=data[c].find(x=>x.id===id); editItem(c,id,{paid:!it.paid}); }
  else if(action==="remove"){ removeItem(btn.dataset.cat, btn.dataset.id); }
  else if(action==="edit-amount"){ startEditAmount(btn.dataset.cat, btn.dataset.id, btn); }
  else if(action==="ask-delete-month"){ if(months.length>1){ confirmDeleteMonth=true; render(); } }
  else if(action==="confirm-delete-month"){ deleteMonthNow(); }
  else if(action==="cancel-delete-month"){ confirmDeleteMonth=false; render(); }
  else if(action==="export-data"){ exportAllData(); }
  else if(action==="import-data"){ const inp=document.getElementById("importFileInput"); if(inp) inp.click(); }
});

document.getElementById("app").addEventListener("change", e=>{
  if(e.target.id === "importFileInput" && e.target.files && e.target.files[0]){
    importAllData(e.target.files[0]);
    e.target.value = "";
  }
});

document.getElementById("app").addEventListener("input", e=>{
  if(e.target.id === "newMonthNameInput"){ newMonthLabelDraft = e.target.value; }
});
document.getElementById("app").addEventListener("keydown", e=>{
  if(e.target.id === "titleInput" && e.key==="Enter"){ renameActiveMonth(e.target.value); }
  if(e.target.id === "newMonthNameInput" && e.key==="Enter"){ e.preventDefault(); const inp=document.getElementById("newMonthNameInput"); createMonth(nextNewMonthKey(), copyPrev, inp ? inp.value : null); }
});

init();
</script>
